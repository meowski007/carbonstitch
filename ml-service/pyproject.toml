[project]
name = "carbonstitch-ml-service"
version = "0.1.0"
description = "Machine learning inference service for garment carbon footprint prediction"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:anyio -p no:asyncio"
