name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footprint-service:
    name: Footprint Service (Java 21 / Spring Boot 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Verify Spotless Code Formatting
        run: mvn spotless:check --file footprint-service/pom.xml

      - name: Build and Run Test Suite with JaCoCo Coverage
        run: mvn clean verify --file footprint-service/pom.xml

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: footprint-service/target/site/jacoco/
          retention-days: 14

  ml-service:
    name: ML Service (Python 3.12 / FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: ml-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Ruff Lint & Format Check
        working-directory: ml-service
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Test Suite
        working-directory: ml-service
        run: |
          pytest -v tests/
