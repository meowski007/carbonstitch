server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: footprint-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:carbonstitch}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names:
      - emissionFactors
      - gridFactors
      - transportFactors
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

app:
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    max-retries: 2
  async:
    core-pool-size: 4
    max-pool-size: 12
    queue-capacity: 100
    thread-name-prefix: "footprint-batch-"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
